    // Fungsi untuk menampilkan SweetAlert2 popup dengan daftar link dan logo
    function showLinksPopup() {

        padding: '2em',

    }

    // Event listener untuk menampilkan popup saat kursor diarahkan ke tombol
    document.getElementById('uniqueHoverButton').addEventListener('mouseover', showLinksPopup);

<script>
  // Fungsi untuk menghasilkan password secara acak
  function generatePassword(length) {
    const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+[]{}|;:,.<>?';
    let password = '';
    for (let i = 0; i < length; i++) {
      const randomIndex = Math.floor(Math.random() * characters.length);
      password += characters[randomIndex];
    }
    return password;
  }

  // Fungsi untuk menampilkan efek kembang api hanya di area tombol
  function showConfetti(button) {
    // Mendapatkan posisi tombol untuk menentukan origin confetti
    const rect = button.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;

    // Menampilkan kembang api dengan confetti di sekitar tombol
    confetti({
      particleCount: 100,
      spread: 70,
      origin: { x: x / window.innerWidth, y: y / window.innerHeight }, // Lokasi asal confetti (di atas tombol)
      colors: ['#ff0000', '#ffffff', '#ff6347'], // Warna confetti (merah, putih, tomat)
      disableForReducedMotion: true // Nonaktifkan animasi untuk pengguna dengan pengaturan aksesibilitas
    });
  }

  // Event listener saat kursor diarahkan ke tombol
  document.getElementById('hoverButton').addEventListener('mouseover', function() {
    const password = generatePassword(12);  // Generate password dengan panjang 12 karakter

    // Salin password ke clipboard
    navigator.clipboard.writeText(password).then(() => {
      console.log('Password copied to clipboard: ' + password);

      // Tampilkan efek kembang api hanya di sekitar tombol
      showConfetti(this);
    }).catch(err => {
      console.error('Error copying password to clipboard: ', err);
    });
  });
</script>

  const lastNames = ["Smith", "Johnson", "Williams", "Brown", "Jones", "Garcia", "Miller", "Davis", "Rodriguez", "Martinez",
    "Hernandez", "Lopez", "Gonzalez", "Wilson", "Anderson", "Thomas", "Taylor", "Moore", "Jackson", "Martin",

    "Young", "King", "Scott", "Green", "Adams", "Baker", "Nelson", "Hall", "Rivera", "Campbell", "Mitchell",
    "Carter", "Robinson", "Gomez", "Phillips", "Evans", "Turner", "Diaz", "Parker", "Cruz", "Edwards",
    "Collins", "Reyes", "Stewart", "Morris", "Ortiz", "Morgan", "Cooper", "Peterson", "Bailey", "Alexander",
    "Riley", "Bell", "Gomez", "Kelly", "Howard", "Ward", "Brooks", "Jenkins", "Wright", "Chavez", "Russell"
    // Tambahkan lebih banyak nama untuk membuatnya mencapai 1000 nama
  ];

  // Fungsi untuk menghasilkan nama secara acak
  function generateName() {
    const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
    const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
    return `${firstName} ${lastName}`;
  }

  // Fungsi untuk menampilkan efek kembang api hanya di area tombol
  function showConfetti(button) {
    const rect = button.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;

    confetti({
      particleCount: 100,
      spread: 70,
      origin: { x: x / window.innerWidth, y: y / window.innerHeight }, 
      colors: ['#ff0000', '#ffffff', '#ff6347'],
      disableForReducedMotion: true
    });
  }

  // Fungsi untuk memastikan nama unik saat halaman di-refresh
  function generateUniqueName() {
    const name = generateName();
    let generatedNames = JSON.parse(localStorage.getItem('generatedNames')) || [];

    // Cek apakah nama sudah ada, jika ada, generate nama baru
    while (generatedNames.includes(name)) {
      name = generateName();
    }

    generatedNames.push(name);
    localStorage.setItem('generatedNames', JSON.stringify(generatedNames));

    return name;
  }

  // Event listener saat kursor diarahkan ke tombol
  document.getElementById('generateNama').addEventListener('mouseover', function() {
    const name = generateUniqueName();  // Generate nama unik

    // Salin nama yang dihasilkan ke clipboard
    navigator.clipboard.writeText(name).then(() => {
      console.log('Nama berhasil disalin: ' + name);
      // Tampilkan efek kembang api hanya di sekitar tombol
      showConfetti(this);
    }).catch(err => {
      console.error('Gagal menyalin nama ke clipboard: ', err);
    });
  });

</script>





   

    <!-- Dark Mode Toggle -->
    <button id="dark-mode-toggle" class="absolute  gendut hidden top-5 right-5 p-2 bg-gray-700 text-white rounded-full">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v18m9-9H3" />

    <!-- Flexbox Layout -->
    <div class="flex gap-10 mb-6">

      <!-- Input Teks di Kiri -->
      <div class="w-1/2 bg-gray-100 dark:bg-gray-700 p-6 rounded-lg shadow-lg space-y-4">

        <textarea
          id="user-input"
          class="mt-2 p-4 w-full border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all ease-in-out dark:bg-gray-600 dark:border-gray-500 dark:text-white"

        ></textarea>

        <!-- Output stats -->
        <div class="flex gap-4">
          <div class="w-1/3 text-center p-2 bg-gray-600 text-white rounded">
            <span id="char-count">0 Huruf</span>
          </div>
          <div class="w-1/3 text-center p-2 bg-gray-600 text-white rounded">
            <span id="word-count">0 Kata</span>
          </div>
          <div class="w-1/3 text-center p-2 bg-gray-600 text-white rounded">
            <span id="sentence-count">0 Kalimat</span>
          </div>
        </div>

      </div>
      
      <!-- Dua Input di Kanan -->
      <div class="w-1/2 space-y-6">

        <!-- Words to Replace -->
        <div class="bg-gray-100 dark:bg-gray-700 p-6 rounded-lg shadow-lg space-y-4">
          <input
            type="text"
            id="words-to-replace"
            class="mt-2 p-4 w-full border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all ease-in-out dark:bg-gray-600 dark:border-gray-500 dark:text-white"
            placeholder="Masukkan kata-kata yang ingin diganti"
          />
        </div>

        <!-- Replacement Words (Menggunakan textarea) -->
        <div class="bg-gray-100 dark:bg-gray-700 p-6 rounded-lg shadow-lg space-y-4">
          <textarea
            id="replacement-words"
            class="mt-2 p-4 w-full border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all ease-in-out dark:bg-gray-600 dark:border-gray-500 dark:text-white"
            placeholder="Masukkan kata penggantinya"
            rows="8"
          ></textarea>
        </div>
      </div>
      
    </div>

    <!-- Output Section -->
    <div class="bg-gray-100 dark:bg-gray-700 p-6 rounded-lg shadow-lg space-y-4">
      <label for="text-display" class="block text-lg font-semibold text-gray-700 dark:text-gray-300">Hasil Penggantian:</label>
      <div id="output-container" class="space-y-4">
        <!-- Kotak-kotak hasil output akan muncul di sini -->
      </div>
    </div>

  </div>

  <script>
    // Dark mode toggle
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    darkModeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    // Clear Storage button
    const clearStorageButton = document.getElementById('clear-storage');
    clearStorageButton.addEventListener('click', () => {
      localStorage.removeItem('userInput');
      localStorage.removeItem('wordsToReplace');
      localStorage.removeItem('replacementWords');
      localStorage.removeItem('output');
      userInput.value = '';
      wordsToReplace.value = '';
      replacementWords.value = '';
      outputContainer.innerHTML = '';
      Toastify({
        text: "Storage cleared!",
        backgroundColor: "green",
        duration: 2000
      }).showToast();
    });

    // Referensi elemen-elemen di HTML
    const userInput = document.getElementById('user-input');
    const wordsToReplace = document.getElementById('words-to-replace');
    const replacementWords = document.getElementById('replacement-words');
    const outputContainer = document.getElementById('output-container');
    const charCount = document.getElementById('char-count');
    const wordCount = document.getElementById('word-count');
    const sentenceCount = document.getElementById('sentence-count');

    // Warna yang berbeda untuk setiap kata yang diganti
    const colors = ['text-teal-500', 'text-blue-500', 'text-green-500', 'text-yellow-500', 'text-purple-500'];

    // Fungsi untuk menghitung statistik
    function updateTextStats() {
      const text = userInput.value.trim();
      const numberOfChars = text.replace(/\s+/g, '').length;
      const numberOfWords = text.split(/\s+/).filter(word => word.length > 0).length;
      const numberOfSentences = text.split(/[.!?]+/).filter(sentence => sentence.trim().length > 0).length;

      // Update elemen di HTML dengan hasil statistik
      charCount.textContent = `${numberOfChars} Huruf`;
      wordCount.textContent = `${numberOfWords} Kata`;
      sentenceCount.textContent = `${numberOfSentences} Kalimat`;
    }

    // Fungsi untuk mengganti kata dan menampilkan hasil secara langsung
    function updateOutput() {
      const inputText = userInput.value.trim();
      const words = wordsToReplace.value.trim().split('/').map(word => word.trim());
      const replacements = replacementWords.value.trim().split('/').map(word => word.trim());

      // Memisahkan teks berdasarkan garis baru dan garis bawah
      const sections = inputText.split('\n').map(paragraph => paragraph.trim()).filter(paragraph => paragraph.length > 0);

      // Hapus konten sebelumnya
      outputContainer.innerHTML = '';

      // Proses penggantian kata dengan warna
      sections.forEach((section) => {
        words.forEach((word, index) => {
          const replacement = replacements[index];
          const colorClass = colors[index % colors.length]; 
          const regex = new RegExp(`\\b${word}\\b`, 'gi');
          
          section = section.replace(regex, match => {
            return `<span class="${colorClass}">${replacement}</span>`;
          });
        });

        const box = document.createElement('div');
        box.classList.add('p-6', 'bg-gray-100', 'rounded-xl', 'shadow-lg', 'cursor-pointer', 'transition', 'hover:shadow-xl', 'hover:bg-gray-200', 'text-xl', 'font-bold', 'text-gray-900');
        box.innerHTML = section;

        // Add subboxes for extra labels (A, B, C, D)
        const subBoxes = ['', 'Kamera menangkapnya dari sudut samping.', 'Kamera menangkapnya dari sudut atas.', 'Kamera menangkapnya dari sudut belakang.', 'Kamera menangkapnya dari sudut jauh.'];
        const subBoxesContainer = document.createElement('div');
        subBoxesContainer.classList.add('flex', 'gap-4', 'text-lg', 'mt-4', 'justify-between');

        subBoxes.forEach((label, index) => {
          const subBox = document.createElement('div');
          subBox.classList.add('p-3', 'rounded-lg', 'cursor-pointer', 'transition', 'text-white', 'flex-grow-1', 'text-xs');
          if (label === '') {
            const copyIcon = document.createElement('div');
            copyIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 17L21 12L16 7"></path></svg>';
            subBox.appendChild(copyIcon);
            subBox.classList.add('bg-red-500');
          } else {
            subBox.classList.add('bg-blue-500', 'hover:bg-blue-600');
          }
          subBox.textContent = label;
          subBox.addEventListener('click', () => {
            const plainText = section.replace(/<[^>]*>/g, '');
            const newText = `${label} ${plainText}`;
            navigator.clipboard.writeText(newText).then(() => {
              Toastify({
                text: "❤️",
                backgroundColor: "transparent",
                duration: 2000
              }).showToast();
            });
          });

          subBoxesContainer.appendChild(subBox);
        });

        box.appendChild(subBoxesContainer);
        outputContainer.appendChild(box);
      });

      // Update statistics after changes
      updateTextStats();

      // Store the input and output in localStorage
      localStorage.setItem('userInput', userInput.value);
      localStorage.setItem('wordsToReplace', wordsToReplace.value);
      localStorage.setItem('replacementWords', replacementWords.value);
      localStorage.setItem('output', outputContainer.innerHTML);
    }

    // Menambahkan event listener untuk input setiap kali pengguna mengetik
    userInput.addEventListener('input', updateOutput);
    wordsToReplace.addEventListener('input', updateOutput);
    replacementWords.addEventListener('input', updateOutput);

    // Initial call for updating stats and input/output from localStorage
    userInput.value = localStorage.getItem('userInput') || '';
    wordsToReplace.value = localStorage.getItem('wordsToReplace') || '';
    replacementWords.value = localStorage.getItem('replacementWords') || '';
    outputContainer.innerHTML = localStorage.getItem('output') || '';
    updateTextStats();
  </script>

</body>
